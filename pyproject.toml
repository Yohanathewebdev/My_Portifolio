[project]
name = "portfolio-cms"
version = "0.1.0"
description = "Foundations for a multi-professional portfolio CMS platform."
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django==5.2.17",
  "djangorestframework==3.16.1",
  "drf-spectacular==0.28.0",
  "celery==5.5.3",
  "redis==6.4.0",
  "psycopg[binary]==3.2.9",
  "django-environ==0.12.0",
  "django-cors-headers==4.7.0",
  "structlog==25.4.0",
  "boto3==1.40.18",
  "argon2-cffi==25.1.0",
  "pyjwt==2.13.0",
  "pyotp==2.9.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-django==4.11.1",
  "pytest-cov==6.2.1",
  "factory-boy==3.3.3",
  "ruff==0.12.8",
  "mypy==1.17.1",
  "django-stubs==5.2.2",
  "djangorestframework-stubs==3.16.1",
  "import-linter==2.6",
  "pip-audit==2.9.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"backend/config/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["backend"]
testpaths = ["backend/apps"]
addopts = "--cov=backend/apps/core --cov=apps.billing.entitlements --cov=apps.core.permissions --cov=apps.accounts.tokens --cov=apps.accounts.authentication --cov=backend/config --cov-report=term-missing --cov-report=json --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["backend/apps/core", "backend/config"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
mypy_path = "backend"

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.importlinter]
root_package = "apps"

[[tool.importlinter.contracts]]
name = "Core is the foundation"
type = "layers"
layers = [
  "apps.api",
  "apps.public",
  "apps.core",
]
