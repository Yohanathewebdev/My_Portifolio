name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.1
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: PYTHONPATH=backend uv run mypy backend
      - run: PYTHONPATH=backend uv run lint-imports
      - run: uv run pytest
        env:
          DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
      - run: uv run python backend/scripts/check_coverage.py
      - run: uv run python backend/manage.py makemigrations --check --dry-run
      - run: uv run python backend/manage.py spectacular --file openapi-schema.yml
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi-schema.yml
      - run: uv run pip-audit
